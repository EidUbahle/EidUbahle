<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EidUbahle ERP – Offline</title>
<style>
  :root { --primary: #2563EB; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
  .card { background: #1e293b; border-radius: 1rem; padding: 3rem 2rem; text-align: center; max-width: 420px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,.5); }
  .icon { font-size: 4rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .75rem; }
  p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
  .btn { display: inline-block; background: var(--primary); color: #fff; padding: .75rem 2rem; border-radius: .5rem; text-decoration: none; font-weight: 600; transition: opacity .2s; }
  .btn:hover { opacity: .85; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>EidUbahle ERP is working in offline mode. All your changes are saved locally and will sync automatically when you reconnect.</p>
  <a href="/" class="btn">Return to App</a>
</div>
<script>
  window.addEventListener('online', () => { window.location.reload(); });
</script>
</body>
</html>
